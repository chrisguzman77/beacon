# Reap dead reverse tunnels from the beacon Pi in ~45 s so a reconnect after a Wi-Fi change can reclaim port 2222
Match User tunnel
    ClientAliveInterval 15
    ClientAliveCountMax 3

# Installed at /etc/ssh/sshd_config.d/50-beacon-tunnel.conf on the Vultr box (then: sshd -t && systemctl reload ssh).
# The tunnel user: useradd -m -s /usr/sbin/nologin tunnel; the Pi key in /home/tunnel/.ssh/authorized_keys as
# restrict,port-forwarding,permitlisten="2222",command="/bin/false" <key>
